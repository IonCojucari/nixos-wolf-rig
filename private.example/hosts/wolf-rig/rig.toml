# Private settings for the host "wolf-rig".
#
# This directory is the template for a folder kept OUTSIDE the repository
# (/etc/nixos-private), so that the repository itself can stay public:
#
#   cp -r private.example /etc/nixos-private
#   rig-rebuild switch          # = nixos-rebuild with the private folder plugged in
#
# Everything under [rig] is laid over the rig.* options of hosts/wolf-rig,
# and wins. Any rig.* option can be set here; the ones below are those that
# usually differ per owner. Any *.nix file next to this one is loaded as an
# extra NixOS module for this host.
#
# Not for passwords or tokens: this file ends up in /nix/store, which every
# local user can read. Those stay in the files scripts/mk-secrets.sh writes.

# What the machine runs: one switch per module (modules/modules.nix). The
# values below are the ones hosts/wolf-rig/rig.nix sets; list only what you
# change.
# [rig.modules]
# streaming = true      # Wolf, for Moonlight clients
# mining = true         # XMRig; stops while someone streams
# power = true          # Wake-on-LAN and shutdown from Home Assistant
# mqtt = false          # also needs [rig.mqtt] broker and /etc/mqtt/password
# tailscale = true
# whisper = true        # the `transcribe` command, a 3 GB model
# gitlab = false        # also needs [rig.gitlab] host
# gitlabRunner = false
# tcpBbr = false

# [rig.admin]
# name = "admin"
# sshKeys = [ "ssh-ed25519 AAAA... you@laptop" ]

# [rig.homeAssistant]
# sshKeys = [ "ssh-ed25519 AAAA... homeassistant" ]

# [rig.disk]
# system = "/dev/disk/by-id/nvme-..."
# data = "/dev/disk/by-id/nvme-..."

# [rig.mining.pool]
# wallet = "4..."

# [rig.mqtt]
# broker = "192.168.1.10"

# [rig.wolf]
# advertiseTailnetRoute = true
# natTailnetPeers = [ "100.64.0.10" ]
