# Runs scripts/check.sh: the same checks as .gitlab-ci.yml and as running
# the script by hand.
name: check

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Evaluate and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan reads the whole history
      - uses: cachix/install-nix-action@v31
      - run: scripts/check.sh

  vm-test:
    name: Gaming guard VM test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          # The test boots a VM; GitHub's Linux runners expose /dev/kvm.
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - run: nix build .#gamingGuardTest --no-link -L
