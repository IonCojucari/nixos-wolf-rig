# A tag v* builds the offline installer ISO and publishes it as a release.
# The ISO holds the public configuration only (installer/target.nix); the
# private folder is never part of it.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  iso:
    name: Installer ISO
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Free disk space
        # The system closure and the ISO need more than a runner has free.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: cachix/install-nix-action@v31
      - run: scripts/check.sh
      - name: Build the ISO
        run: |
          nix build .#installerIso -L
          cp result/iso/*.iso "wolf-rig-installer-$GITHUB_REF_NAME.iso"
          sha256sum "wolf-rig-installer-$GITHUB_REF_NAME.iso" | tee SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME — offline USB installer" \
            "wolf-rig-installer-$GITHUB_REF_NAME.iso" SHA256SUMS
